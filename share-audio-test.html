<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>share audio test</title>
  <style>
    button { margin-top: 12px; padding: 12px 32px; font-size: 20px; }
    #pause { margin-left: 24px; }
  </style>
</head>
<body>
  <div id="status">正在尝试播放…</div>

  <audio id="player" src="./zoom-audio-share.wav" preload="auto" loop></audio>
  <button id="play" type="button">播放</button>
  <button id="pause" type="button">暂停</button>

  <script>
    const audio = document.getElementById('player');
    const statusEl = document.getElementById('status');

    const interactionEvents = ['click', 'touchstart', 'keydown', 'pointerdown'];

    audio.addEventListener('play', () => {
      statusEl.textContent = '播放中';
      interactionEvents.forEach((evt) => document.removeEventListener(evt, playOnInteraction));
    });
    audio.addEventListener('pause', () => { statusEl.textContent = '已暂停'; });

    document.getElementById('play').addEventListener('click', () => {
      audio.play().catch((err) => {
        if (err.name !== 'AbortError') statusEl.textContent = '播放失败：' + err.message;
      });
    });
    document.getElementById('pause').addEventListener('click', () => {
      interactionEvents.forEach((evt) => document.removeEventListener(evt, playOnInteraction));
      audio.pause();
      statusEl.textContent = '已暂停';
    });

    function playOnInteraction(event) {
      if (event.target === audio || ['play', 'pause'].includes(event.target.id)) return;
      audio.play()
        .then(() => { statusEl.textContent = '播放中（用户交互后开始）'; })
        .catch((err) => { statusEl.textContent = '播放失败：' + err.message; });
      interactionEvents.forEach((evt) => document.removeEventListener(evt, playOnInteraction));
    }

    function tryAutoplay() {
      audio.play()
        .then(() => { statusEl.textContent = '播放中（自动播放成功）'; })
        .catch(() => {
          statusEl.textContent = '自动播放被阻止，等待用户交互…';
          interactionEvents.forEach((evt) => document.addEventListener(evt, playOnInteraction));
        });
    }

    window.addEventListener('DOMContentLoaded', tryAutoplay);
  </script>
</body>
</html>
