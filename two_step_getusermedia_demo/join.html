<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单页 getUserMedia 生命周期 Demo</title>
  <style>
    body { max-width: 760px; margin: 36px auto; padding: 0 16px; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; }
    button { margin: 4px 6px 4px 0; padding: 9px 14px; border: 1px solid #777; border-radius: 4px; background: #fff; color: #111; font-size: 15px; cursor: pointer; }
    video { width: 320px; max-width: 100%; margin-top: 12px; background: #222; }
    pre { min-height: 180px; margin-top: 20px; padding: 12px; overflow: auto; background: #111; color: #ddd; white-space: pre-wrap; }
    .hint { color: #555; }
  </style>
</head>
<body>
  <section id="joinView">
    <h1>Waiting Room</h1>
    <p class="hint">Demo version: lifecycle-v3</p>
    <p>点击 Join 后在同一个页面切换到 Preview，模拟实际项目的 React 状态切换。</p>
    <button id="join">Join</button>
    <label><input id="autoRemount" type="checkbox"> 第一次请求 pending 时立即 cleanup + 重挂载</label>
  </section>

  <section id="previewView" hidden>
    <h1>Preview</h1>
    <p class="hint">页面切换后自动执行 effect：第一次 audio + video，随后模拟 SDK 初始化，再请求第二次 video。</p>
    <button id="remount">模拟 cleanup + 重挂载</button>
    <button id="stop">停止轨道</button>
    <button id="back">返回 Join</button>
    <button id="copyLog">复制诊断日志</button>
    <br>
    <video id="video" autoplay muted playsinline></video>
  </section>

  <pre id="log"></pre>
  <script src="./join.js?v=lifecycle-v3"></script>
</body>
</html>
