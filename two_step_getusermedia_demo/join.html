<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join 页面</title>
  <style>
    body { max-width: 680px; margin: 48px auto; padding: 0 16px; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; }
    button { margin-right: 8px; padding: 10px 18px; border: 1px solid #777; border-radius: 4px; background: #fff; color: #111; font-size: 16px; cursor: pointer; }
    pre { margin-top: 24px; padding: 12px; background: #111; color: #ddd; white-space: pre-wrap; }
    .hint { color: #555; }
  </style>
</head>
<body>
  <h1>第一个页面：Join</h1>
  <p>点击后进行真实 URL 跳转，模拟线上从 Waiting Room 进入 Preview 页面。</p>
  <button id="join">Join</button>
  <button id="manual">进入 Preview（不自动请求）</button>
  <p class="hint">跳转后的 Preview 页面会在加载完成后自动调用 getUserMedia。</p>
  <pre id="log"></pre>
  <script src="./join.js"></script>
</body>
</html>
