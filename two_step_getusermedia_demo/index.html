<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>getUserMedia 两次请求 Demo</title>
  <style>
    body { max-width: 900px; margin: 24px auto; padding: 0 16px; font: 14px sans-serif; }
    button { margin: 4px; padding: 8px 12px; cursor: pointer; }
    video { width: 48%; min-height: 180px; margin: 8px 1%; background: #222; }
    pre { max-height: 360px; overflow: auto; padding: 12px; background: #111; color: #ddd; white-space: pre-wrap; }
    .error { color: #f88; }
  </style>
</head>
<body>
  <h1>两次 getUserMedia 请求</h1>
  <p>第一次请求 audio + video，第二次只请求 video。</p>

  <button id="runAll">一键执行</button>
  <button id="first">第一次请求</button>
  <button id="second" disabled>第二次请求</button>
  <button id="stop">停止轨道</button>

  <div>
    <video id="firstVideo" autoplay muted playsinline></video>
    <video id="secondVideo" autoplay muted playsinline></video>
  </div>

  <pre id="log"></pre>
  <script src="./app.js"></script>
</body>
</html>
